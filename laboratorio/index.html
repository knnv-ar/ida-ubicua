<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de efectos · IDA ubicua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js" } }</script>
</head>
<body>
<style>
  /* Laboratorio a pantalla completa: la cinta ocupa todo, el panel flota abajo. */
  :root {
    --fondo: #0B0B0C;
    --texto: #ECE7DF;
    --secundario: #8E8880;
    --velo: rgba(11, 11, 12, 0.86);
    --linea: rgba(236, 231, 223, 0.18);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --datos: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--fondo); color: var(--texto); }
  body { margin: 0; font-family: var(--serif); overscroll-behavior-y: none; }
  #lienzo { position: fixed; top: 0; left: 0; display: block; background: var(--fondo); }
  #cinta { width: 1px; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    background: var(--velo);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--linea);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overscroll-behavior: contain;
  }
  .pista { position: absolute; left: 0; right: 0; top: -1px; height: 1px; overflow: hidden; }
  #barra { height: 100%; background: var(--texto); transform-origin: left; transform: scaleX(0); }
  .barra-sup { display: flex; align-items: center; gap: 12px; min-height: 52px; }
  #nombre-efecto { flex: 1; min-width: 0; font-size: 19px; font-style: italic; }
  #progreso { font-family: var(--datos); font-size: 12px; color: var(--secundario); font-variant-numeric: tabular-nums; }
  button {
    font-family: var(--serif); font-size: 17px; color: var(--texto);
    background: none; border: 1px solid var(--linea); border-radius: 10px;
    min-height: 44px; padding: 0 16px; cursor: pointer;
  }
  button[aria-pressed="true"] { border-color: var(--texto); background: rgba(236, 231, 223, 0.1); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--texto); outline-offset: 2px; }
  #ajustes { max-height: 62vh; overflow-y: auto; padding-bottom: 18px; display: flex; flex-direction: column; gap: 18px; }
  .grupo { display: flex; flex-direction: column; gap: 10px; }
  .botonera { display: flex; flex-wrap: wrap; gap: 8px; }
  .subtitulo { margin: 0; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--secundario); }
  .param { display: flex; flex-direction: column; gap: 4px; }
  .param label { display: flex; justify-content: space-between; gap: 12px; font-size: 17px; }
  .param output { font-family: var(--datos); font-size: 12px; color: var(--secundario); font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type="range"] { width: 100%; accent-color: var(--texto); margin: 0; min-height: 32px; }
  #salida {
    margin: 0; padding: 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: var(--datos); font-size: 12px; line-height: 1.5; color: var(--texto);
    white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text;
  }
  .aviso { margin: 0; font-size: 15px; color: var(--secundario); line-height: 1.4; }
  .cargando { position: fixed; inset: 0; display: grid; place-items: center; font-style: italic; font-size: 20px; color: var(--secundario); z-index: 1; pointer-events: none; }
  body.listo .cargando { display: none; }
  @media (prefers-reduced-motion: reduce) { #barra { transition: none; } }
</style>

<canvas id="lienzo" aria-label="Transición entre dos imágenes de IDA ubicua"></canvas>
<div class="cargando">cargando imágenes…</div>
<div id="cinta"></div>

<section class="panel" aria-label="Controles del laboratorio">
  <div class="pista"><div id="barra"></div></div>
  <div class="barra-sup">
    <span id="nombre-efecto">Reposo · paneo</span>
    <span id="progreso"></span>
    <button type="button" id="abrir" aria-expanded="false" aria-controls="ajustes">ajustes</button>
  </div>
  <div id="ajustes" hidden>
    <p class="aviso">Deslizá el dedo hacia arriba y hacia abajo sobre la imagen: cada foto tiene un paneo y luego la transición. Los cambios se guardan en este navegador.</p>
    <div class="grupo">
      <p class="subtitulo">Efecto</p>
      <div class="botonera" id="botones-efecto"></div>
      <div class="botonera">
        <button type="button" id="shuffle" aria-pressed="false">todos al azar</button>
        <button type="button" id="semilla">otra variación</button>
      </div>
    </div>
    <div class="grupo" id="params"></div>
    <div class="grupo">
      <button type="button" id="restaurar">restaurar valores de este efecto</button>
    </div>
    <div class="grupo">
      <p class="subtitulo">Cinta</p>
      <div class="grupo" id="generales"></div>
    </div>
    <div class="grupo">
      <button type="button" id="valores">ver y copiar valores</button>
      <pre id="salida" hidden></pre>
    </div>
  </div>
</section>

<script type="module" src="lab.js"></script>
</body>
</html>
